<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Choice</title>
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; margin: 0; font-family: 'Segoe UI', sans-serif; color: white; text-align: center; }
        .header-section { background: #2a1b54; border-bottom: 2px solid white; padding: 15px 25px; display: flex; justify-content: center; align-items: center; position: sticky; top: 0; z-index: 100; }
        .header-section h1 { margin: 0; font-size: 26px; }
        .header-actions { position: absolute; right: 25px; display: flex; gap: 12px; }
        .action-btn { font-size: 20px; background: #ffcc00; border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; color: black; display: flex; justify-content: center; align-items: center; font-weight: bold; }
        .main-container { padding: 20px; }
        #searchInput { width: 90%; max-width: 400px; padding: 12px; margin: 10px 0 20px 0; border-radius: 8px; border: none; font-size: 16px; }
        .filters { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        select { padding: 10px; width: 150px; border-radius: 15px; border: none; font-size: 14px; color: black; }
        .product-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 10px; }
        .product-card { background: white; color: #333; padding: 15px; border-radius: 15px; width: 200px; box-sizing: border-box; text-align: center; }
        .product-card img { width: 100%; height: 150px; object-fit: cover; border-radius: 10px; }
        .product-card h3 { margin: 10px 0 5px 0; font-size: 18px; }
        .old-price { text-decoration: line-through; color: #888; font-size: 14px; margin-right: 8px; }
        .offer-price { color: #d32f2f; font-weight: bold; font-size: 16px; }
        .btn { display: block; margin-top: 10px; background: #764ba2; color: white; padding: 8px; border-radius: 5px; text-decoration: none; font-weight: bold; cursor: pointer; border: none; width: 100%; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); justify-content: center; align-items: center; z-index: 200; }
        .modal-content { position: relative; background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(15px); padding: 30px 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.3); width: 90%; max-width: 350px; color: white; box-sizing: border-box; }
        .back-arrow { position: absolute; top: 15px; left: 20px; font-size: 24px; cursor: pointer; font-weight: bold; }
        .modal-content input, .modal-content select { width: 100%; padding: 10px; margin: 8px 0; border-radius: 8px; border: none; font-size: 14px; box-sizing: border-box; color: black; }
        .modal-content button { padding: 10px 20px; background: #ffcc00; border: none; border-radius: 5px; cursor: pointer; color: black; font-weight: bold; margin-top: 10px; width: 100%; }
        .manage-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.9); padding: 10px; border-radius: 10px; margin-bottom: 10px; color: #333; }
        .manage-item img { width: 50px; height: 50px; object-fit: cover; border-radius: 5px; margin-right: 10px; }
        .manage-item-info { flex-grow: 1; text-align: left; }
        .del-btn { background: #d32f2f !important; color: white !important; width: auto !important; padding: 6px 12px !important; margin-top: 0 !important; font-size: 12px; }
    </style>
</head>
<body>

<div class="header-section">
    <h1>Smart Choice</h1>
    <div class="header-actions">
        <button id="manageBtn" class="action-btn">🗑️</button>
        <button id="addBtn" class="action-btn">+</button>
    </div>
</div>

<div class="main-container">
    <input type="text" id="searchInput" placeholder="🔍 Search products...">
    <div class="filters">
        <select id="categoryFilter" onchange="filterProducts()"><option value="all">All Categories</option></select>
        <select id="priceFilter" onchange="filterProducts()"><option value="all">Any Price</option></select>
        <select id="platformFilter" onchange="filterProducts()">
            <option value="all">All Platforms</option>
            <option value="Amazon">Amazon</option><option value="Meesho">Meesho</option>
            <option value="Flipkart">Flipkart</option><option value="Myntra">Myntra</option>
            <option value="Zomato">Zomato</option><option value="Swiggy">Swiggy</option>
        </select>
    </div>
    <div id="productList" class="product-grid"></div>
</div>

<div id="modal" class="modal"><div class="modal-content"><span class="back-arrow" onclick="closeModal()">&#8592;</span><div id="stepContent"></div></div></div>
<div id="manageModal" class="modal"><div class="modal-content"><span class="back-arrow" onclick="closeManageModal()">&#8592;</span><div id="manageStepContent"></div></div></div>
<div id="detailsModal" class="modal"><div class="modal-content"><span class="back-arrow" onclick="closeDetailsModal()">&#8592;</span><div id="detailsContent"></div></div></div>

<script>
    let productTemp = {};
    let productsArray = JSON.parse(localStorage.getItem("products")) || [];

    const categories = ["Kitchen items", "House hold items", "School items", "Crafting items", "Gadgets", "Garden items", "Decor items", "Lights and lamps", "Dresses", "Stickers", "Toys", "Cake decor items", "Plastic plants and flower pots"];
    const platforms = ["Amazon", "Meesho", "Flipkart", "Myntra", "Zomato", "Swiggy"];

    function saveToLocalStorage() { localStorage.setItem("products", JSON.stringify(productsArray)); }

    window.onload = () => {
        const catFilter = document.getElementById('categoryFilter');
        window.catOptionsForAdd = categories.map(cat => `<option value="${cat}">${cat}</option>`).join('');
        catFilter.innerHTML += window.catOptionsForAdd;

        let priceOpts = "";
        for(let i = 100; i <= 5000; i += 100) priceOpts += `<option value="${i}">Under ₹${i}</option>`;
        document.getElementById('priceFilter').innerHTML += priceOpts;
        window.priceOptionsForAdd = priceOpts;

        window.platOptionsForAdd = platforms.map(p => `<option value="${p}">${p}</option>`).join('');
        renderMainProducts();
    };

    document.getElementById('addBtn').onclick = () => { document.getElementById('modal').style.display = 'flex'; showStep(1); };
    document.getElementById('manageBtn').onclick = () => { document.getElementById('manageModal').style.display = 'flex'; showManageStep(1); };
    function closeModal() { document.getElementById('modal').style.display = 'none'; }
    function closeManageModal() { document.getElementById('manageModal').style.display = 'none'; }
    function closeDetailsModal() { document.getElementById('detailsModal').style.display = 'none'; }

    function showStep(step) {
        const s = document.getElementById('stepContent');
        if(step === 1) s.innerHTML = `<h3>Enter PIN</h3><input type="password" id="pin"><button onclick="checkPin()">Next</button>`;
        else if(step === 2) s.innerHTML = `<h3>Product Link</h3><input type="text" id="pLink"><button onclick="save(2)">Next</button>`;
        else if(step === 3) s.innerHTML = `<h3>Upload Image</h3><input type="file" id="pImg" accept="image/*"><button onclick="save(3)">Next</button>`;
        else if(step === 4) s.innerHTML = `<h3>Details</h3><input type="text" id="pName" placeholder="Name"><select id="pCat">${window.catOptionsForAdd}</select><select id="pPlat">${window.platOptionsForAdd}</select><input type="number" id="pOldPrice" placeholder="Old Price"><input type="number" id="pOfferPrice" placeholder="Offer Price"><button onclick="finish()">Add Product</button>`;
    }

    function checkPin() { if(document.getElementById('pin').value === "9633") showStep(2); else alert("Wrong PIN!"); }

    function save(step) {
        if(step === 2) productTemp.link = document.getElementById('pLink').value;
        if(step === 3) {
            const file = document.getElementById('pImg').files[0];
            const reader = new FileReader();
            reader.onload = (e) => { productTemp.img = e.target.result; showStep(4); };
            reader.readAsDataURL(file); return;
        }
        showStep(step + 1);
    }

    function finish() {
        productsArray.push({ id: Date.now(), name: document.getElementById('pName').value, cat: document.getElementById('pCat').value, plat: document.getElementById('pPlat').value, oldPrice: document.getElementById('pOldPrice').value, offerPrice: document.getElementById('pOfferPrice').value, img: productTemp.img, link: productTemp.link });
        saveToLocalStorage(); renderMainProducts(); closeModal();
    }

    function renderMainProducts() {
        document.getElementById('productList').innerHTML = productsArray.map(p => 
            `<div class="product-card" data-category="${p.cat}" data-platform="${p.plat}" data-price="${p.offerPrice}">
                <img src="${p.img}">
                <h3>${p.name}</h3>
                <p>${p.plat}</p>
                <p><span class="old-price">₹${p.oldPrice}</span> <span class="offer-price">₹${p.offerPrice}</span></p>
                <button class="btn" onclick="showDetails(${p.id})">View Details</button>
            </div>`
        ).join('');
        filterProducts();
    }

    function showDetails(id) {
        const p = productsArray.find(item => item.id === id);
        const detailsDiv = document.getElementById('detailsContent');
        detailsDiv.innerHTML = `
            <img src="${p.img}" style="width:100%; height:200px; object-fit:cover; border-radius:10px;">
            <h3>${p.name}</h3>
            <p>Platform: ${p.plat}</p>
            <p>Price: <span class="offer-price">₹${p.offerPrice}</span> <span class="old-price">₹${p.oldPrice}</span></p>
            <a href="${p.link}" target="_blank" class="btn">Go to ${p.plat}</a>
        `;
        document.getElementById('detailsModal').style.display = 'flex';
    }

    function filterProducts() {
        const searchText = document.getElementById('searchInput').value.toLowerCase();
        const cat = document.getElementById('categoryFilter').value;
        const price = document.getElementById('priceFilter').value;
        const plat = document.getElementById('platformFilter').value;
        document.querySelectorAll('.product-card').forEach(card => {
            const title = card.querySelector('h3').innerText.toLowerCase();
            card.style.display = (title.includes(searchText) && (cat === 'all' || card.dataset.category === cat) && (plat === 'all' || card.dataset.platform === plat) && (price === 'all' || parseFloat(card.dataset.price) <= parseFloat(price))) ? '' : 'none';
        });
    }
    document.getElementById('searchInput').addEventListener('keyup', filterProducts);

    function showManageStep(step) {
        if(step === 1) document.getElementById('manageStepContent').innerHTML = `<h3>Enter PIN</h3><input type="password" id="mPin"><button onclick="checkManagePin()">Access Settings</button>`;
        else {
            document.getElementById('manageStepContent').innerHTML = `<h3>Manage Products</h3><div id="manageListContainer"></div>`;
            document.getElementById('manageListContainer').innerHTML = productsArray.map(p => `<div class="manage-item"><img src="${p.img}"><div class="manage-item-info"><h4>${p.name}</h4><p>₹${p.offerPrice}</p></div><button class="del-btn" onclick="deleteProduct(${p.id})">Delete</button></div>`).join('');
        }
    }
    function checkManagePin() { if(document.getElementById('mPin').value === "9633") showManageStep(2); else alert("Wrong PIN!"); }
    function deleteProduct(id) { productsArray = productsArray.filter(p => p.id !== id); saveToLocalStorage(); renderMainProducts(); showManageStep(2); }
</script>
</body>
</html>
